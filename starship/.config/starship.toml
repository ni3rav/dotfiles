# ~/.config/starship.toml

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

format = "$directory$character"

[character]
success_symbol = "[❯](bold #7aa2f7)"
error_symbol = "[❯](bold #7aa2f7)"
vimcmd_symbol = "[❮](bold #7aa2f7)"

[directory]
style = "bold #7aa2f7"
format = "[$path]($style) "
truncation_length = 3
truncate_to_repo = false
home_symbol = "~"
