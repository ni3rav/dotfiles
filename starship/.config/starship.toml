# ~/.config/starship.toml

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

format = "$directory$character"

[character]
success_symbol = "[❯](bold #7fb4ca)"
error_symbol = "[❯](bold #7fb4ca)"
vimcmd_symbol = "[❮](bold #7fb4ca)"

[directory]
style = "bold #7fb4ca"
format = "[$path]($style) "
truncation_length = 3
truncate_to_repo = false
home_symbol = "~"
